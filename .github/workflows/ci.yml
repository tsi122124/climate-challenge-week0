name: CI

on:
  push:
    branches:
      - main
      - eda-ethiopia

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install pandas numpy matplotlib seaborn scipy

      - name: Run basic check
        run: python --version
